  vol.addEventListener('change', () => { Store.setSetting('volume', +vol.value / 100); });
  $('.set-test', body).addEventListener('click', () => { Store.state.settings.volume = +vol.value / 100; Sound.ensure(); Sound.setVolume(+vol.value / 100); Sound.stopAll(); Sound.notes([60, 64, 67, 72], 'arp'); });
  $('.slot-acc', body).appendChild(segmented([['sharp', 'Sharps · C♯ D♯'], ['flat', 'Flats · D♭ E♭']], s.acc, v => Store.setSetting('acc', v), 'Black-key names'));
  $('.slot-labels', body).appendChild(segmented([['names', 'Names'], ['sargam', 'Sargam'], ['none', 'Off']], labelsPref(), v => Store.setSetting('labels', v), 'Key labels'));
  $('.slot-goal', body).appendChild(segmented([['10', '10'], ['20', '20'], ['40', '40'], ['60', '60']], String(s.goal), v => Store.setSetting('goal', +v), 'Daily goal'));
  const an = $('#set-autonext', body); an.checked = !!s.autoNext; an.addEventListener('change', () => Store.setSetting('autoNext', an.checked));
  Sheet.open('Settings', body, { onClose: () => { if (JSON.stringify(Store.state.settings) !== before) route(); } });
  refreshSoundStatus();
}
const INSTRUMENT_CHOICES = [['piano', 'Grand piano', 'Piano'], ['harmonium', 'Harmonium', 'Harmonium'], ['epiano', 'Electric piano', 'E-piano']];
function chooseInstrument(v, demo) {
  Store.setSetting('instrument', v);
  Sound.ensure(true);
  const p = Sound.setInstrument(v);
  refreshSoundStatus();
  if (demo) p.then(() => { if (Sound.instrument !== v) return; Sound.stopAll(); Sound.notes([60, 64, 67, 72], 'arp', { step: 0.24, hold: 1.3 }); });
}
function refreshSoundStatus() { const t = Sound.status(); $$('.snd-status').forEach(el => { el.textContent = t; }); }

/* =========================================================
   Router and start-up
   ========================================================= */
const VIEWS = { home: renderHome, learn: renderLearn, practice: renderPractice, progress: renderProgress };
let currentRoute = '', bootRoute = null;
function routeName() { const n = (location.hash || '').replace(/^#/, ''); return n || bootRoute || 'home'; }
function route() {
  const name = routeName();
  Life.leave(); Sound.stopAll(); Sheet.close();
  const view = $('#view');
  view.innerHTML = '';
  let tab = name;
  if (name.indexOf('lesson-') === 0) { tab = 'learn'; renderLesson(view, name.slice(7)); }
  else if (name.indexOf('ex-') === 0) { tab = 'practice'; renderExercise(view, name.slice(3)); }
  else if (VIEWS[name]) VIEWS[name](view);
  else { tab = 'home'; renderHome(view); }
  $$('[data-tab]').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (currentRoute && currentRoute !== name) { window.scrollTo(0, 0); try { view.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  currentRoute = name;
  refreshSoundStatus();
}
function go(name) { if (routeName() === name && location.hash) route(); else location.hash = name; }

document.addEventListener('click', e => {
  const chip = e.target.closest && e.target.closest('[data-notes]');
  if (chip) {
    e.preventDefault();
    const ms = chip.dataset.notes.trim().split(/\s+/).map(Number);
    Sound.stopAll();
    const r = Sound.notes(ms, chip.dataset.mode || 'mel');
    chip.classList.add('is-playing'); clearTimeout(chip._t); chip._t = setTimeout(() => chip.classList.remove('is-playing'), r.dur * 1000);
    return;
  }
  const dr = e.target.closest && e.target.closest('[data-drill]');
  if (dr) {
    e.preventDefault();
    try {
      const d = JSON.parse(dr.dataset.drill), ex = d.ex; delete d.ex;
      if (!EX[ex]) return;
      Store.setExCfg(ex, Object.assign({}, exCfg(ex), d));
      go('ex-' + ex);
    } catch (err) { /* ignore */ }
  }
});
/* Browsers only start audio after a tap or key press; warm it up on the first one. */
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, () => { Sound.ensure(true); }, { capture: true, passive: true }));
window.addEventListener('hashchange', route);
$('#settingsBtn').addEventListener('click', openSettings);
Store.onChange(type => {
  if (type === 'remote' && Store.state.settings.instrument !== Sound.instrument) Sound.setInstrument(Store.state.settings.instrument);
  if (type === 'remote' && ['home', 'learn', 'practice', 'progress'].indexOf(currentRoute) >= 0 && !Sheet.isOpen) route();
  else if (type === 'sync') syncLine();
});

Sound.setInstrument(Store.state.settings.instrument);
Sound.onLoad(refreshSoundStatus);
$$('[data-icon]').forEach(el => { const svg = ICON[el.dataset.icon]; if (svg) el.outerHTML = svg; });
{ const lg = $('#logo'); if (lg) lg.outerHTML = ICON.logo; }

route();
Store.connect();
try {
  const hot = window.claude && window.claude.hot;
  if (hot) {
    if (typeof hot.snapshot === 'function') hot.snapshot(() => ({ route: currentRoute }));
    const apply = data => { if (data && typeof data.route === 'string' && !location.hash && data.route !== currentRoute) { bootRoute = data.route; route(); } };
    if (typeof hot.ready === 'function') hot.ready(apply); else apply(hot.data);
  }
} catch (e) { /* ignore */ }

</script>
</body>
</html>
